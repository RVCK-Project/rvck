%YAML 1.2
---
$id: http://devicetree.org/schemas/perf/xuange,cpm-pmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xuange v1 CHI performance monitor

maintainers:
  - Dong Yan <yandong@linux.alibaba.com>

description: |
  CPM provides eight CHI transaction/latency counter slots and OSTD/LCRD
  flow-control statistics. CPU subsystem instances have an additional
  selector register; DDR subsystem instances do not. Control registers
  must not be reconfigured while monitoring is enabled.

properties:
  compatible:
    const: xuange,cpm-pmu-v1

  reg:
    minItems: 1
    items:
      - description: CPM monitoring registers
      - description: Optional CPU subsystem CPM selector register

  interrupts:
    maxItems: 1

  numa-node-id:
    description: NUMA node containing this CPM instance.

  xuange,cpm-name:
    $ref: /schemas/types.yaml#/definitions/string
    pattern: '^[a-zA-Z0-9_]+$'
    description: |
      Unique instance suffix for the cpm_ perf PMU name, such as
      die0_complex8 or die0_ddr2a. If omitted, the driver derives the
      name from the register address.

  xuange,fpga:
    type: boolean
    description: |
      This instance uses the 7.6 MHz HAPS CPM input clock. The driver uses
      a monitoring-period exponent of 16. When absent, the instance uses
      the 1.9 GHz silicon clock and an exponent of 24.

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        pmu@192120000 {
            compatible = "xuange,cpm-pmu-v1";
            reg = <0x1 0x92120000 0x0 0x230>,
                  <0x1 0x92121034 0x0 0x4>;
            interrupt-parent = <&aplic>;
            interrupts = <5 4>;
            numa-node-id = <0>;
            xuange,cpm-name = "die0_complex8";
            xuange,fpga;
        };
    };
