%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/lprs,zf-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LeapRise ZF(ZhuFeng) serial UART

maintainers:
  - Liu Wenhong <liu.wenhong35@zte.com.cn>
  - Liu Qingtao <liu.qingtao2@zte.com.cn>

description: |
  Should be something similar to "lprs,<chip>-uart"
  for the UART as integrated on a particular chip.

properties:
  compatible:
    enum:
      - lprs,zf-uart
      - lrw,lrw-uart # deprecated, kept for backward compatibility

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - current-speed
  - clocks

additionalProperties: false

examples:
  - |
    uart0: serial@e0001800 {
      compatible = "lprs,zf-uart";
      interrupt-parent = <&aplic0>;
      interrupts = <0x12 0x4>;
      reg = <0xe0001800 0x100>;
      clocks = <&bar_clk>;
      current-speed = <115200>;
    };
