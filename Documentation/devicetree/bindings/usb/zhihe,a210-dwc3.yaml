%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/zhihe,a210-dwc3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZhiHe A210 DWC3 USB controller

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  The ZhiHe A210 USB 3.1 wrapper provides SoC-specific clocks and resets
  around a Synopsys DesignWare USB3 controller.

properties:
  compatible:
    const: zhihe,a210-dwc3

  reg:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: pclk
      - const: slave-afence

  resets:
    minItems: 3
    maxItems: 3

  power-domains:
    maxItems: 1

  "#address-cells":
    const: 2

  "#size-cells":
    const: 2

  ranges: true

patternProperties:
  "^usb@[0-9a-f]+$":
    $ref: snps,dwc3.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - power-domains
  - "#address-cells"
  - "#size-cells"
  - ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/zhihe,a210-clk.h>
    #include <dt-bindings/reset/zhihe,a210-resets.h>

    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        usb-wrapper@8100000 {
            compatible = "zhihe,a210-dwc3";
            reg = <0x00 0x08100000 0x0 0x100000>;
            clocks = <&clk_usb USB31_PCLK_EN>,
                     <&clk_usb USB31_SLV_AFENCE_ACLK_EN>;
            clock-names = "pclk", "slave-afence";
            resets = <&rst_usb USB_USB31_SLV_AFENCE_ARST>,
                     <&rst_usb USB_USB31_VCC_RST>,
                     <&rst_usb USB_USB31_APBS_PRST>;
            power-domains = <&power_usb>;
            #address-cells = <2>;
            #size-cells = <2>;
            ranges = <0x00 0x00 0x00 0x08100000 0x00 0x100000>;

            usb@0 {
                compatible = "snps,dwc3";
                reg = <0x00 0x00 0x00 0x100000>;
                interrupts = <183>;
                clocks = <&clk_usb USB31_REF_CLK_EN>,
                         <&clk_usb USB31_BUS_CLK_EN>,
                         <&clk_usb USB31_SUSPEND_CLK_EN>;
                clock-names = "ref", "bus_early", "suspend";
                dr_mode = "host";
            };
        };
    };
...
