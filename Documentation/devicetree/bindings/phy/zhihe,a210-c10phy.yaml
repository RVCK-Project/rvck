%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/zhihe,a210-c10phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZhiHe A210 Synopsys C10 USB 3.1 PHY

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  The ZhiHe A210 C10 PHY provides USB3 and DisplayPort PHY ports for the
  USB 3.1 controller and DisplayPort controller.

properties:
  compatible:
    const: zhihe,a210-c10phy

  reg:
    minItems: 4
    maxItems: 4

  reg-names:
    items:
      - const: phy_ctrl
      - const: tca
      - const: sysreg
      - const: dptx_sys

  clocks:
    minItems: 1
    maxItems: 4

  resets:
    minItems: 2
    maxItems: 2

  reset-names:
    items:
      - const: phy-rst
      - const: apb-rst

  power-domains:
    maxItems: 1

  zhihe,dp-lane-mux:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    description: DisplayPort lane mux selection values.

  "#phy-cells":
    const: 0

patternProperties:
  "^(dp|u3)-port$":
    type: object
    additionalProperties: false
    properties:
      max-link-rate:
        $ref: /schemas/types.yaml#/definitions/uint32
      "#phy-cells":
        const: 0
    required:
      - "#phy-cells"

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - resets
  - reset-names
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/zhihe,a210-clk.h>
    #include <dt-bindings/reset/zhihe,a210-resets.h>

    phy@8040000 {
        compatible = "zhihe,a210-c10phy";
        reg = <0x08040000 0x3c000>,
              <0x0807c000 0x2000>,
              <0x0807e000 0x100>,
              <0x08014000 0x200>;
        reg-names = "phy_ctrl", "tca", "sysreg", "dptx_sys";
        clocks = <&clk_usb C10PHY_SUSPEND_CLK_EN>,
                 <&clk_usb C10PHY_PCLK_EN>;
        resets = <&rst_usb USB_C10PHY_PHY_RST>,
                 <&rst_usb USB_C10PHY_APBS_PRST>;
        reset-names = "phy-rst", "apb-rst";
        #phy-cells = <0>;

        dp-port {
            #phy-cells = <0>;
        };

        u3-port {
            #phy-cells = <0>;
        };
    };
