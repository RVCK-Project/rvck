%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/zhihe,a210-usb2-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZhiHe A210 USB 2.0 PHY

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  The ZhiHe A210 contains two USB 2.0 PHYs for the DWC2 controllers, each
  described by a separate node with its own register block and reset.
  The third USB 2.0 PHY is integrated with the DWC3 controller and is
  configured through a register in the shared USB system register block, so
  its node has no reg property of its own.

properties:
  compatible:
    enum:
      - zhihe,a210-dwc2-usb2-phy
      - zhihe,a210-dwc3-usb2-phy

  reg:
    maxItems: 1

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

  zhihe,pulldown-mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 0xf
    description:
      Bit mask selecting the D+ and D- pulldown controls for this PHY.

  zhihe,usb-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the USB clock controller and shared system register block.

  "#phy-cells":
    const: 0

required:
  - compatible
  - resets
  - "#phy-cells"

additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: zhihe,a210-dwc2-usb2-phy
    then:
      properties:
        zhihe,usb-syscon: false
      required:
        - reg
        - zhihe,pulldown-mask
    else:
      properties:
        reg: false
        zhihe,pulldown-mask: false
      required:
        - zhihe,usb-syscon

examples:
  - |
    #include <dt-bindings/reset/zhihe,a210-resets.h>

    usb2_phy0: usb-phy@8300000 {
        compatible = "zhihe,a210-dwc2-usb2-phy";
        reg = <0x08300000 0x1000>;
        resets = <&rst_usb USB_USB20_BLK_USB0_PHY_PON_RESET>;
        zhihe,pulldown-mask = <0x3>;
        #phy-cells = <0>;
    };

  - |
    #include <dt-bindings/reset/zhihe,a210-resets.h>

    usb2-phy {
        compatible = "zhihe,a210-dwc3-usb2-phy";
        zhihe,usb-syscon = <&clk_usb>;
        resets = <&rst_usb USB_USB31_PHY_RST>;
        #phy-cells = <0>;
    };
