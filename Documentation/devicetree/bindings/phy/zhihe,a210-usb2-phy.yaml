%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/zhihe,a210-usb2-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZhiHe A210 USB 2.0 PHY

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  The ZhiHe A210 contains two USB 2.0 PHYs for the DWC2 controllers, each in
  its own register block. Both are described by a single node whose PHY
  specifier selects the port index.
  The third USB 2.0 PHY is integrated with the DWC3 controller and is
  configured through a single register of the USB31 block. It is described as
  a child of the syscon owning that register, which also provides its register
  range, so the PHY node has no reg property of its own.

properties:
  compatible:
    enum:
      - zhihe,a210-dwc2-usb2-phy
      - zhihe,a210-dwc3-usb2-phy

  reg:
    minItems: 2
    maxItems: 2

  resets:
    minItems: 1
    maxItems: 2

  power-domains:
    maxItems: 1

  "#phy-cells":
    enum: [0, 1]

required:
  - compatible
  - resets
  - "#phy-cells"

additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: zhihe,a210-dwc2-usb2-phy
    then:
      properties:
        reg:
          minItems: 2
          maxItems: 2
        resets:
          minItems: 2
          maxItems: 2
        "#phy-cells":
          const: 1
      required:
        - reg
    else:
      properties:
        reg: false
        resets:
          minItems: 1
          maxItems: 1
        "#phy-cells":
          const: 0

examples:
  - |
    #include <dt-bindings/reset/zhihe,a210-resets.h>

    usb-phy@8300000 {
        compatible = "zhihe,a210-dwc2-usb2-phy";
        reg = <0x08300000 0x1000>,
              <0x08301000 0x1000>;
        resets = <&rst_usb USB_USB20_BLK_USB0_PHY_PON_RESET>,
                 <&rst_usb USB_USB20_BLK_USB1_PHY_PON_RESET>;
        #phy-cells = <1>;
    };

  - |
    #include <dt-bindings/reset/zhihe,a210-resets.h>

    usb31_syscon: syscon@80000a0 {
        compatible = "zhihe,a210-usb31-syscon", "syscon", "simple-mfd";
        reg = <0x080000a0 0x4>;

        usb2-phy-dwc3 {
            compatible = "zhihe,a210-dwc3-usb2-phy";
            resets = <&rst_usb USB_USB31_PHY_RST>;
            #phy-cells = <0>;
        };
    };
