%YAML 1.2
---
$id: http://devicetree.org/schemas/net/zhihe,a210-dwmac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 DWMAC Ethernet controller

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  The Zhihe A210 integrates a Synopsys DesignWare MAC (dwmac-5.20) with
  an SoC-specific glue layer. The node also carries the standard
  snps,dwmac properties documented in net/snps,dwmac.yaml.

select:
  properties:
    compatible:
      contains:
        const: zhihe,a210-dwmac
  required:
    - compatible

properties:
  compatible:
    items:
      - const: zhihe,a210-dwmac
      - const: snps,dwmac-5.20

  reg:
    maxItems: 1

  reg-names:
    const: gmac

  clocks:
    minItems: 4
    maxItems: 4

  clock-names:
    items:
      - const: stmmaceth
      - const: pclk
      - const: x2h-aclk
      - const: x2h-hclk

  zhihe,gmacsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the syscon node controlling GMAC interface mode and
      timing delays.

  rx-clk-delay:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: RGMII RX clock delay setting.

  tx-clk-delay:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: RGMII TX clock delay setting.

  snps,pbl:
    description: Programmable burst length.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2, 4, 8, 16, 32]

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - interrupts
  - zhihe,gmacsys

allOf:
  - $ref: snps,dwmac.yaml#

unevaluatedProperties: true

examples:
  - |
    ethernet@2100000 {
        compatible = "zhihe,a210-dwmac", "snps,dwmac-5.20";
        reg = <0x02100000 0x10000>;
        interrupt-parent = <&intc>;
        interrupts = <277>;
        interrupt-names = "macirq";
        phy-mode = "rgmii-id";
        clocks = <&clk_peri 0>, <&clk_peri 1>,
                 <&clk_peri 2>, <&clk_peri 3>;
        clock-names = "stmmaceth", "pclk", "x2h-aclk", "x2h-hclk";
        resets = <&rst 0>, <&rst 1>;
        reset-names = "stmmaceth", "ahb";
        zhihe,gmacsys = <&gmac0_sys>;
    };
