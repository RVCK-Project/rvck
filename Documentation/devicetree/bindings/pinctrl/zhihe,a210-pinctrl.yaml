%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/zhihe,a210-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 Pin Controller

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  Pin controller for the Zhihe A210 SoC. The A210 has several pad
  controller instances (AON and PERI pad controllers). Each instance is
  identified by its compatible string and provides pin multiplexing and
  configuration for its pad group.

properties:
  compatible:
    enum:
      - zhihe,a210-aon-pinctrl
      - zhihe,a210-peri1-pinctrl
      - zhihe,a210-peri2-pinctrl
      - zhihe,a210-peri3-pinctrl

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: pclk

required:
  - compatible
  - reg

additionalProperties: true

examples:
  - |
    pinctrl@30848000 {
        compatible = "zhihe,a210-aon-pinctrl";
        reg = <0x30848000 0x2000>;
        clocks = <&aon_110m>;
        clock-names = "pclk";
    };
