%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/zhihe/zhihe,a210-iopmp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 IOPMP Controller

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  IO Physical Memory Protection (IOPMP) controller used on Zhihe SoCs
  to restrict peripheral DMA access to memory. Each named register
  region corresponds to an IOPMP instance guarding a particular
  subsystem.

properties:
  compatible:
    const: zhihe,a210-iopmp

  reg:
    minItems: 1
    maxItems: 16

  reg-names:
    minItems: 1
    maxItems: 16

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    iopmp@26b12000 {
        compatible = "zhihe,a210-iopmp";
        reg = <0x26b12000 0x1000>, <0x26372000 0x1000>;
        reg-names = "vp-iopmp", "vi-iopmp";
    };
